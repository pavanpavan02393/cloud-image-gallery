<!DOCTYPE html>
<html>

<head>

    <title>Cloud Image Gallery</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <h1>Cloud Image Gallery</h1>
    <button onclick="toggleMode()">Dark Mode</button>

    <form method="POST" enctype="multipart/form-data">

        <input type="file" name="image" required>

        <button type="submit">Upload</button>

    </form>
    <form method="GET">

        <input type="text" name="search" placeholder="Search image">

        <button type="submit">Search</button>

    </form>

    <div class="gallery">

        {% for image in images %}

        <div>

            <img src="{{ url_for('static', filename='uploads/' + image) }}">
            <h3>{{ image }}</h3>
            <p>

                <a href="{{ cloud_urls[image] }}" target="_blank">

                    Open Cloud Image

                </a>

            </p>
            <br><br>

            <a href="{{ url_for('static', filename='uploads/' + image) }}" download>

                <button>Download</button>

            </a>

            <br><br>

            <a href="{{ url_for('delete_image', filename=image) }}">

                <button>Delete</button>

            </a>

        </div>

        {% endfor %}

    </div>
    <script>

        function toggleMode() {
            document.body.classList.toggle("dark");
        }

    </script>

</body>

</html>
